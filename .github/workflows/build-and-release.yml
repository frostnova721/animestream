name: Build and Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        type: boolean
        default: true
      send_notification:
        description: 'Send Discord Notification'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Tag to build (empty = latest pushed tag)'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'v*'

env:
  FLUTTER_VERSION: '3.41.6'
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # Extract version from pubspec.yaml
  extract-version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      version_code: ${{ steps.get-version.outputs.version_code }}
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Determine tag
        id: get-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TARGET_TAG="${{ inputs.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          elif [ "${{ github.event_name }}" = "push" ]; then
            TARGET_TAG=${GITHUB_REF#refs/tags/}
          fi
          echo "tag=$TARGET_TAG" >> $GITHUB_OUTPUT
          echo "Target tag: $TARGET_TAG"

      - name: Checkout target tag
        if: ${{ steps.get-tag.outputs.tag != '' }}
        run: git checkout ${{ steps.get-tag.outputs.tag }}

      - name: Extract version
        id: get-version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          VERSION_CODE=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION+$VERSION_CODE"

  # ANDROID BUILDS
  build-android-apk:
    name: Android Build
    runs-on: ubuntu-latest
    needs: extract-version
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract-version.outputs.tag }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Setup env File
        env:
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          COMMENTUM_API_URL: ${{ secrets.COMMENTUM_API_URL }}
          DISCORD_APP_ID: ${{secrets.DISCORD_APP_ID }}
        shell: bash
        run: |
          echo "SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET" > .env
          echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID" >> .env
          echo "COMMENTUM_API_URL=$COMMENTUM_API_URL" >> .env
          echo "DISCORD_APP_ID=$DISCORD_APP_ID" >> .env

      - name: Decode and setup keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
            echo "storePassword=$STORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=release-keystore.jks" >> android/key.properties
            echo "Keystore configured for signing"
          else
            echo "No keystore configured - using debug signing"
            echo "storePassword=" > android/key.properties
            echo "keyPassword=" >> android/key.properties
            echo "keyAlias=androiddebugkey" >> android/key.properties
            echo "storeFile=/tmp/debug.keystore" >> android/key.properties
            keytool -genkey -v -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
      - name: Build Universal APK
        run: |
          flutter build apk \
            --release \
            --dart-define-from-file=.env \
            --build-number=${{ needs.extract-version.outputs.version_code }} \
            --build-name=${{ needs.extract-version.outputs.version }}

      - name: Build Split APKs
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --dart-define-from-file=.env \
            --build-number=${{ needs.extract-version.outputs.version_code }} \
            --build-name=${{ needs.extract-version.outputs.version }}

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          
  # LINUX BUILDS
  build-linux:
    name: Linux Build
    runs-on: ubuntu-latest
    needs: extract-version
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract-version.outputs.tag }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libsecret-1-dev \
            libwebkit2gtk-4.1-dev \
            flatpak-builder \
            flatpak

      - name: Get Flutter version
        run: flutter --version

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Setup env File
        env:
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          COMMENTUM_API_URL: ${{ secrets.COMMENTUM_API_URL }}
          DISCORD_APP_ID: ${{secrets.DISCORD_APP_ID }}
        shell: bash
        run: |
          echo "SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET" > .env
          echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID" >> .env
          echo "COMMENTUM_API_URL=$COMMENTUM_API_URL" >> .env
          echo "DISCORD_APP_ID=$DISCORD_APP_ID" >> .env

      - name: Build Linux
        run: |
          flutter build linux \
            --release \
            --dart-define-from-file=.env \
            --build-number=${{ needs.extract-version.outputs.version_code }} \
            --build-name=${{ needs.extract-version.outputs.version }}

      - name: Create portable zip
        run: |
          cd build/linux/x64/release
          zip -r ../../../linux.zip bundle/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: linux.zip
          retention-days: 30

  # WINDOWS BUILDS
  build-windows:
    name: Windows Build
    runs-on: windows-latest
    needs: extract-version
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract-version.outputs.tag }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get Flutter version
        run: flutter --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Setup env File
        env:
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
        shell: bash
        run: |
          echo "SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET" > .env
          echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID" >> .env

      - name: Build Windows
        shell: pwsh
        run: flutter build windows --release --dart-define-from-file=.env --build-number=${{ needs.extract-version.outputs.version_code }} --build-name=${{ needs.extract-version.outputs.version }}

      - name: Create installer
        shell: pwsh
        run: dart run inno_bundle:build --release

      - name: Rename installer
        shell: pwsh
        run: |
          Get-ChildItem -Path "build\windows\x64\installer\Release\*.exe" | Rename-Item -NewName "animestream-x86_64.exe"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: build/windows/x64/installer/Release/animestream-x86_64.exe
          retention-days: 30


  # CREATE RELEASE
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
    - extract-version
    - build-android-apk
    - build-linux
    - build-windows
    - post-release-notes 
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release == true || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract-version.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f

      - name: Collect release assets
        run: |
          mkdir release-files
          find artifacts -type f \
            \( -name "*.apk" -o -name "*.deb" -o -name "*.rpm" -o -name "*.zip" -o -name "*.exe" -o -name "*.flatpak" \) \
            -exec cp {} release-files/ \;

          echo "Release files:"
          ls -lh release-files

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog
          path: .
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.extract-version.outputs.version }}
          name: v${{ needs.extract-version.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  post-release-notes:
    runs-on: ubuntu-latest
    needs: extract-version
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract-version.outputs.tag }}
          fetch-depth: 0

      - name: Clear existing CHANGELOG.md
        run: |
          echo "" > CHANGELOG.md

      - name: Get previous tag
        id: get_prev_tag
        run: |
          echo "Getting previous tag..."
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "prev_tag=$PREV_TAG" >> $GITHUB_ENV

      - name: Get commit messages between tags
        id: get_commits
        run: |
          COMMITS=$(git log ${{ env.prev_tag }}..HEAD --pretty=format:'%h %s' | tr '\n' '|')
          echo "commits=$COMMITS" >> $GITHUB_ENV

      - name: Categorize commits
        id: categorize
        run: |
          echo "Categorizing commits..."
          FEATURES=""
          BUG_FIXES=""
          REFACTORS=""
          STYLE_CHANGES=""
          PERFORMANCE=""
          CHORES=""
          REPO_URL="https://github.com/${{ github.repository }}"

          IFS='|' read -ra COMMIT_LIST <<< "${{ env.commits }}"
          echo "Commit list: ${COMMIT_LIST[@]}"
          for LINE in "${COMMIT_LIST[@]}"; do
            HASH=$(echo "$LINE" | awk '{print $1}')
            MESSAGE=$(echo "$LINE" | cut -d' ' -f2-)
            LINK="[$HASH]($REPO_URL/commit/$HASH)"

            FORMATTED_COMMIT="* $LINK: $MESSAGE"
            echo "Processing commit: $FORMATTED_COMMIT"
            if [[ $MESSAGE == feat* ]]; then
              FEATURES+="$FORMATTED_COMMIT\n"
            elif [[ $MESSAGE == fix* || $MESSAGE == bug* || $MESSAGE == improvement* || $MESSAGE == patch* ]]; then
              BUG_FIXES+="$FORMATTED_COMMIT\n"
            elif [[ $MESSAGE == refactor* ]]; then
              REFACTORS+="$FORMATTED_COMMIT\n"
            elif [[ $MESSAGE == style* ]]; then
              STYLE_CHANGES+="$FORMATTED_COMMIT\n"
            elif [[ $MESSAGE == perf* ]]; then
              PERFORMANCE+="$FORMATTED_COMMIT\n"
            elif [[ $MESSAGE == chore* || $MESSAGE == docs* || $MESSAGE == build* || $MESSAGE == ci* ]]; then
              CHORES+="$FORMATTED_COMMIT\n"
            fi
          done

          # Write to CHANGELOG.md
          if [ -n "$FEATURES" ]; then
            echo "### 🎉 New Features" >> CHANGELOG.md
            echo -e "$FEATURES" >> CHANGELOG.md
          fi
          if [ -n "$BUG_FIXES" ]; then
            echo "### 🐛 Bug Fixes & Improvements" >> CHANGELOG.md
            echo -e "$BUG_FIXES" >> CHANGELOG.md
          fi
          if [ -n "$REFACTORS" ]; then
            echo "### 🔧 Refactors" >> CHANGELOG.md
            echo -e "$REFACTORS" >> CHANGELOG.md
          fi
          if [ -n "$STYLE_CHANGES" ]; then
            echo "### 🎨 Style Changes" >> CHANGELOG.md
            echo -e "$STYLE_CHANGES" >> CHANGELOG.md
          fi
          if [ -n "$PERFORMANCE" ]; then
            echo "### 🚀 Performance Improvements" >> CHANGELOG.md
            echo -e "$PERFORMANCE" >> CHANGELOG.md
          fi
          if [ -n "$CHORES" ]; then
            echo "### 🧹 Chores & Documentation" >> CHANGELOG.md
            echo -e "$CHORES" >> CHANGELOG.md
          fi

          # Add footer
          echo "---" >> CHANGELOG.md
          echo "**Full Changelog**: $REPO_URL/compare/${{ env.prev_tag }}...v${{ needs.extract-version.outputs.version }}" >> CHANGELOG.md

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md

      - name: Commit and push changelog
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: update changelog for v${{ needs.extract-version.outputs.version }}"
          git push origin HEAD:${{ github.event.repository.default_branch }} || echo "No changes to push"

  notify:
    name: Notify Release
    needs: [create-release, post-release-notes]
    if: ${{ always() && (needs.create-release.result == 'success' || needs.post-release-notes.result == 'success') && inputs.send_notification == true }}
    uses: ./.github/workflows/Notify.yml
    secrets: inherit
