name: Build and Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        type: boolean
        default: true
      send_notification:
        description: 'Send Discord Notification'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Existing tag to build (empty = selected branch/commit, version from pubspec.yaml)'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'v*'

env:
  FLUTTER_VERSION: '3.47.1'
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # Extract version from pubspec.yaml
  extract-version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      version_code: ${{ steps.get-version.outputs.version_code }}
      tag: ${{ steps.get-version.outputs.tag }}
      sha: ${{ steps.get-version.outputs.sha }}
      prerelease: ${{ steps.get-version.outputs.prerelease }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Select source
        id: get-tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            TARGET_TAG="$INPUT_TAG"
          elif [ "$EVENT_NAME" = "push" ]; then
            TARGET_TAG=${GITHUB_REF#refs/tags/}
          else
            TARGET_TAG=""
          fi
          if [ -n "$TARGET_TAG" ]; then
            git check-ref-format "refs/tags/$TARGET_TAG"
            git rev-parse --verify "refs/tags/$TARGET_TAG^{commit}"
            git checkout --detach "refs/tags/$TARGET_TAG"
          fi
          echo "tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"

      - name: Extract version
        id: get-version
        env:
          SOURCE_TAG: ${{ steps.get-tag.outputs.tag }}
        shell: python
        run: |
          import os
          import re
          import subprocess
          from pathlib import Path

          values = re.findall(r'^version:\s*([^\r\n#]+)', Path('pubspec.yaml').read_text(), re.M)
          value = values[0].strip().strip("\"'") if len(values) == 1 else ''
          match = re.fullmatch(r'(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)\+([1-9]\d*)', value)
          if not match:
              raise SystemExit('Expected one pubspec version in the form 1.2.3[-prerelease]+build-number')
          version, code = match.groups()
          tag = f'v{version}'
          source_tag = os.environ['SOURCE_TAG']
          if source_tag and source_tag != tag:
              raise SystemExit(f'Tag {source_tag} does not match pubspec version {value} (expected {tag})')
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          existing = subprocess.run(['git', 'rev-parse', '--verify', f'refs/tags/{tag}^{{commit}}'], capture_output=True, text=True)
          if existing.returncode == 0 and existing.stdout.strip() != sha:
              raise SystemExit(f'{tag} already points to another commit. Bump pubspec version or explicitly build that tag.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nversion_code={code}\ntag={tag}\nsha={sha}\nprerelease={str("-" in version).lower()}\n')
          print(f'Building commit {sha}: {value}, release tag {tag}')

  # ANDROID BUILDS
  build-android-apk:
    name: Android Build
    runs-on: ubuntu-latest
    needs: extract-version
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract-version.outputs.sha }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Setup env File
        env:
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          COMMENTUM_API_URL: ${{ secrets.COMMENTUM_API_URL }}
          DISCORD_APP_ID: ${{secrets.DISCORD_APP_ID }}
        shell: bash
        run: |
          echo "SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET" > .env
          echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID" >> .env
          echo "COMMENTUM_API_URL=$COMMENTUM_API_URL" >> .env
          echo "DISCORD_APP_ID=$DISCORD_APP_ID" >> .env

      - name: Decode and setup keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
            echo "storePassword=$STORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=release-keystore.jks" >> android/key.properties
            echo "Keystore configured for signing"
          else
            echo "No keystore configured - using debug signing"
            echo "storePassword=android" > android/key.properties
            echo "keyPassword=android" >> android/key.properties
            echo "keyAlias=androiddebugkey" >> android/key.properties
            echo "storeFile=/tmp/debug.keystore" >> android/key.properties
            keytool -genkey -v -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
      - name: Build Universal APK
        run: |
          flutter build apk \
            --release \
            --dart-define-from-file=.env \
            --build-number=${{ needs.extract-version.outputs.version_code }} \
            --build-name=${{ needs.extract-version.outputs.version }}

      - name: Build Split APKs
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --dart-define-from-file=.env \
            --build-number=${{ needs.extract-version.outputs.version_code }} \
            --build-name=${{ needs.extract-version.outputs.version }}

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          
  # LINUX BUILDS
  build-linux:
    name: Linux Build
    runs-on: ubuntu-latest
    needs: extract-version
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract-version.outputs.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libsecret-1-dev \
            libwebkit2gtk-4.1-dev \
            flatpak-builder \
            flatpak

      - name: Get Flutter version
        run: flutter --version

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Setup env File
        env:
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          COMMENTUM_API_URL: ${{ secrets.COMMENTUM_API_URL }}
          DISCORD_APP_ID: ${{secrets.DISCORD_APP_ID }}
        shell: bash
        run: |
          echo "SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET" > .env
          echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID" >> .env
          echo "COMMENTUM_API_URL=$COMMENTUM_API_URL" >> .env
          echo "DISCORD_APP_ID=$DISCORD_APP_ID" >> .env

      - name: Build Linux
        run: |
          flutter build linux \
            --release \
            --dart-define-from-file=.env \
            --build-number=${{ needs.extract-version.outputs.version_code }} \
            --build-name=${{ needs.extract-version.outputs.version }}

      - name: Create portable zip
        run: |
          cd build/linux/x64/release
          zip -r ../../../linux.zip bundle/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: build/linux.zip
          if-no-files-found: error
          retention-days: 30

  # WINDOWS BUILDS
  build-windows:
    name: Windows Build
    runs-on: windows-latest
    needs: extract-version
    env:
      # permission_handler_windows still uses /await. Keep older release tags
      # compatible with MSVC's STL1011 check until the plugin is migrated.
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract-version.outputs.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get Flutter version
        run: flutter --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Setup env File
        env:
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          COMMENTUM_API_URL: ${{ secrets.COMMENTUM_API_URL }}
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
        shell: bash
        run: |
          echo "SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET" > .env
          echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID" >> .env
          echo "COMMENTUM_API_URL=$COMMENTUM_API_URL" >> .env
          echo "DISCORD_APP_ID=$DISCORD_APP_ID" >> .env

      - name: Fix FVP CMake Symlink Issue (Download mdk-sdk manually)
        shell: pwsh
        run: |
          curl.exe --fail --location --retry 3 -o mdk-sdk.7z "https://sourceforge.net/projects/mdk-sdk/files/nightly/mdk-sdk-windows-x64.7z/download"
          if ($LASTEXITCODE -ne 0) { throw "Failed to download the MDK SDK" }
          $config = Get-Content ".dart_tool\package_config.json" -Raw | ConvertFrom-Json
          $fvpPackage = $config.packages | Where-Object { $_.name -eq 'fvp' }
          if ($fvpPackage) {
              $uri = $fvpPackage.rootUri
              if ($uri.StartsWith("file://")) {
                  $fvpPath = [System.Uri]::new($uri).LocalPath
              } else {
                  $fvpPath = Resolve-Path (Join-Path ".dart_tool" $uri)
              }
              Write-Host "FVP path: $fvpPath"
              if (Test-Path "$fvpPath\windows") {
                  7z x mdk-sdk.7z -o"$fvpPath\windows" -y
                  if ($LASTEXITCODE -ne 0) { throw "Failed to extract the MDK SDK" }
                  if (!(Test-Path -LiteralPath "$fvpPath\windows\mdk-sdk\lib\cmake\FindMDK.cmake")) {
                      throw "Extracted MDK SDK is missing FindMDK.cmake"
                  }
              } else {
                  Write-Host "FVP windows path not found at $fvpPath\windows!"
                  exit 1
              }
          } else {
              Write-Host "FVP not found in package_config.json!"
              exit 1
          }

      - name: Build Windows
        shell: pwsh
        run: flutter build windows --release --dart-define-from-file=.env --build-number=${{ needs.extract-version.outputs.version_code }} --build-name=${{ needs.extract-version.outputs.version }}

      - name: Create installer
        shell: pwsh
        # Package the existing build so a second build cannot drop dart defines.
        run: dart run inno_bundle:build --release --no-app

      - name: Rename installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path "build\windows\x64\installer\Release\*.exe" -File)
          if ($installers.Count -ne 1) {
              throw "Expected one Windows installer, found $($installers.Count)"
          }
          if ($installers[0].Name -ne "animestream-x86_64.exe") {
              Rename-Item -LiteralPath $installers[0].FullName -NewName "animestream-x86_64.exe"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: build/windows/x64/installer/Release/animestream-x86_64.exe
          if-no-files-found: error
          retention-days: 30


  # CREATE RELEASE
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
    - extract-version
    - build-android-apk
    - build-linux
    - build-windows
    - post-release-notes 
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release == true || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract-version.outputs.sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f

      - name: Collect release assets
        run: |
          mkdir release-files
          find artifacts -type f \
            \( -name "*.apk" -o -name "*.deb" -o -name "*.rpm" -o -name "*.zip" -o -name "*.exe" -o -name "*.flatpak" \) \
            -exec cp {} release-files/ \;

          echo "Release files:"
          ls -lh release-files

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog
          path: .
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.extract-version.outputs.tag }}
          target_commitish: ${{ needs.extract-version.outputs.sha }}
          name: ${{ needs.extract-version.outputs.tag }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ needs.extract-version.outputs.prerelease == 'true' }}
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  post-release-notes:
    runs-on: ubuntu-latest
    needs: extract-version
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract-version.outputs.sha }}
          fetch-depth: 0

      - name: Check for custom release notes
        id: check_custom
        run: |
          if [ -f "RELEASE_NOTES.md" ]; then
            echo "custom=true" >> $GITHUB_OUTPUT
            cp RELEASE_NOTES.md CHANGELOG.md
          else
            echo "custom=false" >> $GITHUB_OUTPUT
            echo "" > CHANGELOG.md
          fi

      - name: Generate changelog
        if: steps.check_custom.outputs.custom == 'false'
        env:
          RELEASE_TAG: ${{ needs.extract-version.outputs.tag }}
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(['git', *args], text=True, encoding='utf-8').strip()

          previous = subprocess.run(
              ['git', 'describe', '--tags', '--match', 'v*', '--abbrev=0', 'HEAD^'],
              capture_output=True, text=True,
          )
          previous_tag = previous.stdout.strip() if previous.returncode == 0 else ''
          revision = f'{previous_tag}..HEAD' if previous_tag else 'HEAD'
          commits = git('log', revision, '--format=%h %s')
          repo_url = f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}'
          sections = {
              'New Features': [], 'Bug Fixes & Improvements': [],
              'Refactors': [], 'Style Changes': [],
              'Performance Improvements': [], 'Chores & Documentation': [],
              'Other Changes': [],
          }
          for line in commits.splitlines():
              commit, message = line.split(' ', 1)
              if message.startswith('feat'):
                  section = 'New Features'
              elif message.startswith(('fix', 'bug', 'improvement', 'patch')):
                  section = 'Bug Fixes & Improvements'
              elif message.startswith('refactor'):
                  section = 'Refactors'
              elif message.startswith('style'):
                  section = 'Style Changes'
              elif message.startswith('perf'):
                  section = 'Performance Improvements'
              elif message.startswith(('chore', 'docs', 'build', 'ci')):
                  section = 'Chores & Documentation'
              else:
                  section = 'Other Changes'
              sections[section].append(f'* [{commit}]({repo_url}/commit/{commit}): {message}')
          lines = []
          for section, entries in sections.items():
              if entries:
                  lines.extend([f'### {section}', *entries, ''])
          tag = os.environ['RELEASE_TAG']
          history_url = f'{repo_url}/compare/{previous_tag}...{tag}' if previous_tag else f'{repo_url}/commits/{tag}'
          lines.extend(['---', f'**Full Changelog**: {history_url}'])
          Path('CHANGELOG.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md

      - name: Commit and push changelog
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ needs.extract-version.outputs.version }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: update changelog for v$VERSION"
          git push origin HEAD:"$DEFAULT_BRANCH" || echo "No changes to push"

  notify:
    name: Notify Release
    needs: [create-release, extract-version]
    if: ${{ needs.create-release.result == 'success' && inputs.send_notification == true }}
    uses: ./.github/workflows/Notify.yml
    with:
      tag_name: ${{ needs.extract-version.outputs.tag }}
    secrets: inherit
